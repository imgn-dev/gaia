name: API docs

# Publishes or removes the API documentation of a released version on the
# gh-pages branch, served at https://imgn-dev.github.io/gaia/api/, and publishes
# the guide of the newest version at https://imgn-dev.github.io/gaia/. The
# release workflow calls it; run it by hand to publish an older version again,
# to remove one that was never published to Maven Central, or to publish the
# guide alone, from a branch, between releases. Every push to main replaces
# the API documentation of the snapshot, at api/snapshot/.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'With publish or remove: released version, MAJOR.MINOR.PATCH, e.g. 0.1.0'
        required: false
        type: string
      action:
        description: 'publish the documentation of the version, remove it, or publish the guide alone'
        required: true
        type: choice
        options:
          - publish
          - remove
          - guide
        default: publish
      ref:
        description: 'With guide: the branch or tag to build the guide from (default: the default branch)'
        required: false
        type: string
        default: ''
      replace:
        description: 'With publish: replace the documentation of a version already published'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

# Two runs must never push to gh-pages at the same time.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      # A call from the release workflow always publishes, and never replaces.
      ACTION: ${{ github.event_name == 'push' && 'snapshot' || inputs.action || 'publish' }}
      REPLACE: ${{ inputs.replace && '--replace' || '' }}
    steps:
      - if: env.ACTION == 'publish' || env.ACTION == 'remove'
        name: Check version format
        run: |
          if [[ ! $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version is '$VERSION'. It must be MAJOR.MINOR.PATCH, e.g. 0.1.0, and nothing else."
            exit 1
          fi

      # The scripts of the default branch work on the sources of any tag.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main

      - if: env.ACTION != 'remove'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.ACTION == 'snapshot' && github.sha || env.ACTION == 'guide' && (inputs.ref || github.event.repository.default_branch) || format('v{0}', inputs.version) }}
          path: source

      # A release pushes its own commit and the next snapshot's together, so the
      # pushed commit is a snapshot unless main was set to a release by hand.
      - if: env.ACTION == 'snapshot'
        name: Check snapshot version
        working-directory: source
        run: |
          version=$(sed -nE 's/.*-Drevision=([^[:space:]]+).*/\1/p' .mvn/maven.config)
          if [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-SNAPSHOT$ ]]; then
            echo "SNAPSHOT_VERSION=$version" >>"$GITHUB_ENV"
            echo "SNAPSHOT_COMMIT=$(git rev-parse --short HEAD)" >>"$GITHUB_ENV"
          else
            echo "The version is '$version', not a snapshot: nothing to publish."
            echo 'SKIP=true' >>"$GITHUB_ENV"
          fi

      - if: env.ACTION != 'remove' && env.SKIP != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - if: (env.ACTION == 'publish' || env.ACTION == 'snapshot') && env.SKIP != 'true'
        name: Build the documentation
        run: main/scripts/javadoc.sh source "$RUNNER_TEMP/javadoc"

      # Versions before 0.1.2 have no guide.
      - if: env.ACTION == 'publish' || env.ACTION == 'guide'
        name: Build the guide
        working-directory: source
        run: |
          if [[ -d docs ]]; then
            ./mvnw -B -ntp package -pl docs -am -DskipTests
            echo "GUIDE=$PWD/docs/target/guide" >>"$GITHUB_ENV"
            echo "GUIDE_COMMIT=$(git rev-parse --short HEAD)" >>"$GITHUB_ENV"
          elif [[ $ACTION == guide ]]; then
            echo '::error::This ref has no guide.'
            exit 1
          else
            echo 'This version has no guide.'
          fi

      - if: env.SKIP != 'true'
        name: Check out gh-pages
        working-directory: main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin gh-pages:gh-pages; then
            git worktree add ../site gh-pages
          else
            echo 'No gh-pages branch yet: starting it.'
            git worktree add --orphan -b gh-pages ../site
          fi

      - if: env.SKIP != 'true'
        name: Update the site
        run: |
          case $ACTION in
          publish)
            main/scripts/docs-site.sh publish site "$VERSION" "$RUNNER_TEMP/javadoc" $REPLACE
            if [[ -n ${GUIDE:-} ]]; then
              main/scripts/docs-site.sh guide site "$GUIDE" "$VERSION"
            fi
            ;;
          guide)
            main/scripts/docs-site.sh guide site "$GUIDE"
            ;;
          snapshot)
            main/scripts/docs-site.sh snapshot site "$RUNNER_TEMP/javadoc"
            ;;
          remove)
            main/scripts/docs-site.sh remove site "$VERSION"
            ;;
          esac

      - if: env.SKIP != 'true'
        name: Push gh-pages
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
            exit 0
          fi
          case $ACTION in
          publish) git commit -m "docs: publish the documentation of $VERSION" ;;
          guide)   git commit -m "docs: publish the guide of $GUIDE_COMMIT" ;;
          snapshot) git commit -m "docs: publish the API of $SNAPSHOT_VERSION ($SNAPSHOT_COMMIT)" ;;
          remove)  git commit -m "docs: remove the API of $VERSION" ;;
          esac
          git push origin gh-pages
