name: Release

# Manual only. Publishing is deliberately not automatic on push to main.
on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Version to release: MAJOR.MINOR.PATCH, e.g. 0.1.0'
        required: true
        type: string
      nextVersion:
        description: 'Next development version: MAJOR.MINOR.PATCH, e.g. 0.2.0 (-SNAPSHOT is added for you)'
        required: true
        type: string

# Nothing by default: each job asks for what it needs.
permissions: {}

# Two releases must never interleave their version commits and tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # To push the release commit and tag, and to create the GitHub release.
      contents: write
    # The inputs reach the steps through the environment only, never spliced
    # into a script: the first step checks them, but no step relies on that.
    env:
      RELEASE_VERSION: ${{ inputs.releaseVersion }}
      NEXT_VERSION: ${{ inputs.nextVersion }}
    steps:
      # First, before anything is checked out or published.
      - name: Check version format
        run: |
          pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          for name in RELEASE_VERSION NEXT_VERSION; do
            value=${!name}
            if [[ ! $value =~ $pattern ]]; then
              echo "::error::$name is '$value'. It must be MAJOR.MINOR.PATCH, e.g. 0.1.0, and nothing else."
              exit 1
            fi
          done
          # sort -V orders semantic versions numerically: 0.10.0 after 0.9.0.
          if [[ $NEXT_VERSION == "$RELEASE_VERSION" \
                || $(printf '%s\n%s\n' "$RELEASE_VERSION" "$NEXT_VERSION" | sort -V | tail -n 1) != "$NEXT_VERSION" ]]; then
            echo "::error::nextVersion must be later than releaseVersion."
            exit 1
          fi

      # The release commits back to the branch it ran on; only main is released.
      - name: Check branch
        run: |
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::Releases run from main, not $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A full history, so the tag this workflow pushes has ancestry.
          fetch-depth: 0
          # The build must not find a token it could push with: the push step
          # below passes it to that one command.
          persist-credentials: false

      # No Maven cache: a release builds from a clean repository, so nothing a
      # build on another branch left in the cache can reach the signed artifacts.
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The version lives only in .mvn/maven.config, as -Drevision. Every POM
      # reads ${revision}; flatten-maven-plugin resolves it in the published POMs.
      - name: Set release version
        run: sed -i -E "s/-Drevision=[^[:space:]]+/-Drevision=$RELEASE_VERSION/" .mvn/maven.config

      # As scripts/release.sh does, before the long build: a release whose tag
      # exists, or whose commits main no longer leads to, would upload to
      # Central and only then fail to push.
      - name: Check the tag and main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          remote=$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            ls-remote origin refs/heads/main "refs/tags/v$RELEASE_VERSION")
          if git rev-parse -q --verify "refs/tags/v$RELEASE_VERSION" >/dev/null \
              || [[ -n $(awk '$2 != "refs/heads/main"' <<<"$remote") ]]; then
            echo "::error::Tag v$RELEASE_VERSION already exists."
            exit 1
          fi
          if [[ $(awk '$2 == "refs/heads/main" {print $1}' <<<"$remote") != "$(git rev-parse HEAD)" ]]; then
            echo '::error::main has moved since this run started. Run the release again.'
            exit 1
          fi

      # Every module, the *-tests modules included, on the release version.
      - name: Verify
        run: ./mvnw -B --no-transfer-progress clean verify

      # Again, as main may have moved during the build.
      - name: Check the tag and main again
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          remote=$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            ls-remote origin refs/heads/main "refs/tags/v$RELEASE_VERSION")
          if [[ -n $(awk '$2 != "refs/heads/main"' <<<"$remote") ]]; then
            echo "::error::Tag v$RELEASE_VERSION already exists."
            exit 1
          fi
          if [[ $(awk '$2 == "refs/heads/main" {print $1}' <<<"$remote") != "$(git rev-parse HEAD)" ]]; then
            echo '::error::main has moved since this run started. Run the release again.'
            exit 1
          fi

      # Only now, after the build and its tests have run, so that none of them
      # had the signing key within reach.
      - name: Set up publishing credentials
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          # Writes ~/.m2/settings.xml with a <server> whose id matches
          # <publishingServerId>central</publishingServerId> in the parent POM.
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # -Prelease (from be.imgn.parent:parent) rejects SNAPSHOT versions and
        # dependencies, attaches sources and javadoc, signs with GPG, and hands
        # the bundle to central-publishing-maven-plugin. The *-tests modules are
        # never deployed. autoPublish is false, so the deployment waits in the
        # Central portal for a human to release it.
        #
        # skipTests and invoker.skip: the Verify step above already ran every test
        # and integration test. This step publishes; it does not test, and runs
        # no Maven build of the integration tests with the credentials around.
        # The entries of the jars are dated as the released commit, so that the
        # artifacts can be rebuilt byte for byte.
        run: >-
          ./mvnw -B --no-transfer-progress -Prelease -DskipTests -Dinvoker.skip
          -Dproject.build.outputTimestamp="$(git log -1 --format=%cI)" deploy

      - name: Tag the release
        # The POM may already sit at the version being released, in which case
        # setting it changed nothing and there is nothing to commit. That must
        # not fail the run: publishing has already happened by this point.
        run: |
          if git diff --quiet; then
            echo "Already at $RELEASE_VERSION, nothing to commit."
          else
            git commit -am "Release $RELEASE_VERSION"
          fi
          git tag -a "v$RELEASE_VERSION" -m "Release $RELEASE_VERSION"

      - name: Start the next development version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          next=$NEXT_VERSION-SNAPSHOT
          sed -i -E "s/-Drevision=[^[:space:]]+/-Drevision=$next/" .mvn/maven.config
          git commit -am "Start $next"
          # The token goes to this command only, as the header actions/checkout
          # would have stored in .git/config.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # Atomic: the commits and the tag are pushed together, or none is.
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push --atomic origin HEAD "refs/tags/v$RELEASE_VERSION"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$RELEASE_VERSION" --title "v$RELEASE_VERSION" --generate-notes

  # Built from the tag, so it does not wait for the deployment to be published
  # in the Central portal. If it never is, remove the documentation with the
  # API docs workflow.
  docs:
    needs: release
    permissions:
      # The publish job of the API docs workflow pushes to gh-pages.
      contents: write
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ inputs.releaseVersion }}
